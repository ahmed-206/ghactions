on: 
  workflow_dispatch:
    inputs:
      evnironment:
        description: Choose environment
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy application
        run: echo "deploy application to ${{ inputs.evnironment }}"
